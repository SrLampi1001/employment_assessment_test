[project]
name = "riwi-backend"
version = "0.1.0"
description = "Riwi Co. Internal Messaging Platform — backend (FastAPI + PostgreSQL)."
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
