[project]
name = "riwi-backend"
version = "0.1.0"
description = "Riwi Co. Internal Messaging Platform — backend (FastAPI + PostgreSQL)."
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary,pool]>=3.2",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
bdd_features_base_dir = "tests/features"
